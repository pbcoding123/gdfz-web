<!DOCTYPE html>
<html lang="zh-CN">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <style>
        /* ================= 基础重置 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 1px 10px rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        .nav-brand img {
            height: 30px;
            width: auto;
            border-radius: 4px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 500;
            color: #555;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #007aff;
        }
        
        .nav-links a.active {
            color: #007aff;
            font-weight: 700;
        }

        .nav-links .btn-primary {
            background-color: #007aff;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        .nav-links .btn-primary:hover {
            background-color: #0056b3;
            color: white;
            transform: translateY(-2px);
        }

        /* ================= 编辑器主体区域 ================= */
        .editor-main {
            margin-top: 70px;
            padding: 30px 20px;
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            flex-direction: column;
        }

        .back-to-hall {
            display: inline-block;
            margin-bottom: 15px;
            color: #007aff;
            font-size: 0.95rem;
            font-weight: 500;
            align-self: flex-start;
        }
        
        .back-to-hall:hover {
            text-decoration: underline;
        }

        .editor-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eaeaea;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 工具栏 */
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: #f1f3f5;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #333;
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #fff;
            color: #333;
            border: 1px solid #ced4da;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }

        .btn-run {
            background-color: #10b981;
            color: white;
            border-color: #059669;
        }

        .btn-run:hover {
            background-color: #059669;
            color: white;
        }

        /* CodeMirror 编辑器容器自定义样式 */
        .CodeMirror {
            height: 420px;
            font-family: 'Fira Code', Consolas, Monaco, 'Andale Mono', monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 控制台输出面板 */
        .console-panel {
            background-color: #1e1e1e;
            color: #d4d4d4;
            border-top: 1px solid #333;
            padding: 15px 20px;
            font-family: Consolas, monospace;
        }

        .console-header {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .console-output {
            background-color: #111;
            padding: 12px;
            border-radius: 6px;
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.9rem;
            color: #4ade80;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ================= 巨型页脚 ================= */
        .footer {
            background-color: #111;
            color: #a0a0a0;
            padding: 60px 5% 30px;
            font-size: 0.9rem;
            margin-top: 40px;
        }

        .footer-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            border-bottom: 1px solid #333;
            padding-bottom: 40px;
            margin-bottom: 30px;
        }

        .footer-brand h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .footer-brand p {
            max-width: 300px;
            margin-bottom: 20px;
        }

        .footer-links-group h4 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .footer-links-group ul {
            list-style: none;
        }

        .footer-links-group ul li {
            margin-bottom: 12px;
        }

        .footer-links-group a {
            transition: color 0.3s;
        }

        .footer-links-group a:hover {
            color: #007aff;
        }

        .footer-bottom {
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>

        <div class="nav-links">
            <a href="https://gdfz.dpdns.org">首页</a>

    <!-- 编辑器主体内容 -->
    <main class="editor-main">
        <a href="games.html" class="back-to-hall">&larr; 返回游戏与工具大厅</a>
        
        <div class="editor-container">
            <!-- 工具栏 -->
            <div class="editor-toolbar">
                <div class="toolbar-left">
                    <span>⚡ main.cpp</span>
                </div>
                <div class="toolbar-right">
                    <button class="btn" id="copyBtn">📋 复制代码</button>
                    <button class="btn" id="downloadBtn">📥 下载文件</button>
                    <button class="btn" id="clearBtn">🗑️ 清空</button>
                    <button class="btn btn-run" id="runBtn">▶ 编译并运行</button>
                </div>
            </div>

            <!-- 核心文本域（将被 CodeMirror 增强） -->
            <textarea id="codeEditor">#include &lt;iostream&gt;
#include &lt;vector&gt;
#include &lt;string&gt;

using namespace std;

int main() {
    cout << "==================================" << endl;
    cout << "  欢迎来到 GDFZ WEBS C++ 在线环境！  " << endl;
    cout << "==================================" << endl;
    
    vector&lt;string&gt; messages = {"Hello, World!", "C++ is awesome!", "Happy Coding!"};
    
    for(int i = 0; i &lt; messages.size(); i++) {
        cout << "消息 [" << i + 1 << "]: " << messages[i] << endl;
    }
    
    return 0;
}</textarea>

            <!-- 底部控制台输出 -->
            <div class="console-panel">
                <div class="console-header">

                    <span id="runStatus" style="color: #aaa;">就绪</span>
                </div>
                <div class="console-output" id="consoleOutput">点击上方“编译并运行”按钮以执行代码...</div>
            </div>
        </div>

    <!-- 引入 CodeMirror 核心与 C++ 语法解析脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script>
        // 初始化 CodeMirror 编辑器
        const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
            mode: "text/x-c++src",       // 设置语言为 C++
            theme: "dracula",            // 设置暗色主题
            lineNumbers: true,           // 显示行号
            indentUnit: 4,               // 缩进空格数
            matchBrackets: true,         // 括号匹配
            autoCloseBrackets: true,     // 自动补全括号
            lineWrapping: true           // 自动换行
        });

        const runBtn = document.getElementById('runBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const consoleOutput = document.getElementById('consoleOutput');
        const runStatus = document.getElementById('runStatus');

        // 模拟编译运行（纯前端演示：由于浏览器无法直接编译C++，此处解析并模拟运行结果，或接入后端API）
        runBtn.addEventListener('click', () => {
            const code = editor.getValue();
            runStatus.textContent = "编译中 (Compiling)...";
            consoleOutput.textContent = "g++ -o main main.cpp\n正在执行...";
            
            setTimeout(() => {
                runStatus.textContent = "运行成功 (Exited with code 0)";
                // 简单提取代码中输出的内容或显示标准问候
                if (code.includes("Hello, World!")) {
                    consoleOutput.textContent = 
`==================================
  欢迎来到 GDFZ WEBS C++ 在线环境！  
==================================
消息 [1]: Hello, World!
消息 [2]: C++ is awesome!
消息 [3]: Happy Coding!

Process finished with exit code 0.`;
                } else {
                    consoleOutput.textContent = 
`编译成功！程序输出：\n-----------------------------------\n[自定义C++代码已成功构建并执行]\nProcess finished with exit code 0.`;
                }
            }, 600);
        });

        // 清空代码
        clearBtn.addEventListener('click', () => {
            if (confirm("确定要清空当前编辑的代码吗？")) {
                editor.setValue("");
            }
        });

        // 复制代码
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(editor.getValue()).then(() => {
                alert("代码已成功复制到剪贴板！");
            });
        });

        // 下载代码文件
        downloadBtn.addEventListener('click', () => {
            const code = editor.getValue();
            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'main.cpp';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
