<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇 - GDFZ WEBS</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 导航栏 */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); box-shadow: 0 1px 10px rgba(0, 0, 0, 0.05); z-index: 1000; }
        .nav-brand { font-size: 22px; font-weight: 700; color: #1a1a1a; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: #555; text-decoration: none; font-weight: 500; }
        .user-panel { display: flex; gap: 10px; align-items: center; font-size: 0.9rem; }
        .btn-auth { background: #007aff; color: white; border: none; padding: 6px 14px; border-radius: 15px; cursor: pointer; }

        /* 主区域 */
        .game-layout { margin-top: 90px; padding: 20px; max-width: 1000px; margin-left: auto; margin-right: auto; display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
        .canvas-container { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        canvas { background: #1e293b; border-radius: 8px; display: block; margin: 15px auto; }
        
        /* 排行榜 */
        .leaderboard-box { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 300px; }
        .leaderboard-box h3 { border-bottom: 2px solid #007aff; padding-bottom: 8px; margin-bottom: 12px; }
        .score-list { list-style: none; }
        .score-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .score-item strong { color: #007aff; }

        /* 模态弹框 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: white; padding: 30px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .modal input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">GDFZ WEBS</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="games.html">Games</a>
            <a href="https://gdfz.dpdns.org/chat">社交圈</a>
            <div class="user-panel" id="userPanel">
                <button class="btn-auth" onclick="openAuthModal()">登录 / 注册</button>
            </div>
        </div>
    </nav>

    <!-- 主体：游戏 + 排行榜 -->
    <main class="game-layout">
        <div class="canvas-container">
            <h2>🐍 贪吃蛇大作战</h2>
            <p>当前得分: <b id="currentScore" style="color: #007aff;">0</b></p>
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <button class="btn-auth" onclick="startGame()">开始游戏</button>
        </div>

        <!-- D1 排行榜面板 -->
        <div class="leaderboard-box">
            <h3>🏆 英雄榜 (Cloudflare D1)</h3>
            <ul class="score-list" id="leaderboardList">
                <li class="score-item">加载中...</li>
            </ul>
        </div>
    </main>

    <!-- 登录/注册 弹窗 -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <h3 id="modalTitle">账号登录 / 注册</h3>
            <input type="text" id="authUsername" placeholder="用户名">
            <input type="password" id="authPassword" placeholder="密码">
            <div class="modal-btns">
                <button style="background: #007aff; color: white;" onclick="handleAuth('login')">登录</button>
                <button style="background: #10b981; color: white;" onclick="handleAuth('register')">注册</button>
            </div>
            <button style="background: #ccc;" onclick="closeAuthModal()">取消</button>
        </div>
    </div>

    <script>
        // 配置你的 Cloudflare Worker API 地址
        const API_BASE = 'https://your-worker-subdomain.workers.dev';

        let currentUser = JSON.parse(localStorage.getItem('gdfz_user')) || null;
        let score = 0;
        let gameInterval = null;

        // 初始化用户状态 & 加载排行榜
        updateUserUI();
        loadLeaderboard();

        // 用户状态显示
        function updateUserUI() {
            const userPanel = document.getElementById('userPanel');
            if (currentUser) {
                userPanel.innerHTML = `<span>👤 <b>${escapeHtml(currentUser.username)}</b></span> <button onclick="logout()" style="background:none;border:none;color:#ff3b30;cursor:pointer;">退出</button>`;
            } else {
                userPanel.innerHTML = `<button class="btn-auth" onclick="openAuthModal()">登录 / 注册</button>`;
            }
        }

        // 打开/关闭登录弹窗
        function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

        // 处理登录与注册
        async function handleAuth(type) {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if(!username || !password) return alert('请输入账号密码');

            const res = await fetch(`${API_BASE}/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                if (type === 'login') {
                    currentUser = data.user;
                    localStorage.setItem('gdfz_user', JSON.stringify(currentUser));
                    updateUserUI();
                    closeAuthModal();
                    alert('登录成功！');
                } else {
                    alert('注册成功，请点击登录！');
                }
            } else {
                alert(data.msg);
            }
        }

        function logout() {
            localStorage.removeItem('gdfz_user');
            currentUser = null;
            updateUserUI();
        }

        // 加载 D1 排行榜
        async function loadLeaderboard() {
            try {
                const res = await fetch(`${API_BASE}/api/score/leaderboard?game=snake`);
                const { data } = await res.json();
                const listEl = document.getElementById('leaderboardList');
                listEl.innerHTML = '';
                
                if (data && data.length > 0) {
                    data.forEach((item, index) => {
                        listEl.innerHTML += `
                            <li class="score-item">
                                <span>${index + 1}. ${escapeHtml(item.username)}</span>
                                <strong>${item.score} 分</strong>
                            </li>
                        `;
                    });
                } else {
                    listEl.innerHTML = '<li class="score-item">暂无榜单成绩</li>';
                }
            } catch (err) {
                console.error("加载排行榜失败:", err);
            }
        }

        // 提交分数到 D1
        async function submitScore(finalScore) {
            if (!currentUser || finalScore <= 0) return;
            await fetch(`${API_BASE}/api/score/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUser.id,
                    username: currentUser.username,
                    gameType: 'snake',
                    score: finalScore
                })
            });
            loadLeaderboard(); // 刷新排行榜
        }

        // 简易贪吃蛇逻辑演示
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let snake = [{x: 10, y: 10}];
        let food = {x: 5, y: 5};
        let dir = {x: 1, y: 0};

        function startGame() {
            clearInterval(gameInterval);
            snake = [{x: 10, y: 10}];
            score = 0;
            dir = {x: 1, y: 0};
            document.getElementById('currentScore').textContent = score;
            gameInterval = setInterval(gameLoop, 150);
        }

        function gameLoop() {
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
            
            // 撞墙逻辑
            if(head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20) {
                clearInterval(gameInterval);
                alert(`游戏结束！得分: ${score}`);
                submitScore(score);
                return;
            }

            snake.unshift(head);
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('currentScore').textContent = score;
                food = {x: Math.floor(Math.random()*20), y: Math.floor(Math.random()*20)};
            } else {
                snake.pop();
            }

            // 渲染
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0,0,400,400);
            ctx.fillStyle = '#10b981';
            snake.forEach(p => ctx.fillRect(p.x*20, p.y*20, 18, 18));
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(food.x*20, food.y*20, 18, 18);
        }

        window.addEventListener('keydown', e => {
            if(e.key === 'ArrowUp' && dir.y === 0) dir = {x:0, y:-1};
            if(e.key === 'ArrowDown' && dir.y === 0) dir = {x:0, y:1};
            if(e.key === 'ArrowLeft' && dir.x === 0) dir = {x:-1, y:0};
            if(e.key === 'ArrowRight' && dir.x === 0) dir = {x:1, y:0};
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
