<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心 - 我的个人网站</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        /* 导航栏样式 */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #3498db;
        }

        nav ul li a.active {
            color: #3498db;
            border-bottom: 2px solid #3498db;
        }

        /* 主体内容区域 */
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* 游戏卡片网格布局 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 单个游戏卡片 */
        .game-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .game-cover {
            height: 160px;
            background-color: #e0e6ed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: #a0aec0;
        }

        /* 为不同的游戏设置不同背景色作区分 */
        .game-card:nth-child(1) .game-cover { background: #ffeaa7; color: #fdcb6e; }
        .game-card:nth-child(2) .game-cover { background: #81ecec; color: #00cec9; }
        .game-card:nth-child(3) .game-cover { background: #fab1a0; color: #e17055; }
        .game-card:nth-child(4) .game-cover { background: #55efc4; color: #00b894; }

        .game-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #2d3748;
        }

        .game-desc {
            font-size: 0.95rem;
            color: #718096;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .play-btn {
            display: inline-block;
            text-align: center;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .play-btn:hover {
            background-color: #2980b9;
        }
        
        .play-btn.disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        .play-btn.disabled:hover {
            background-color: #cbd5e0;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 20px 0;
            color: #7f8c8d;
            margin-top: 40px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">MySite</div>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="about.html">关于我</a></li>
                <li><a href="games.html" class="active">游戏中心</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1>游戏中心</h1>
            <p>挑选一个你想玩的游戏，放松一下吧！</p>
        </div>

        <div class="games-grid">
            <!-- 游戏卡片 1 -->
            <div class="game-card">
                <div class="game-cover">🐍</div>
                <div class="game-info">
                    <h3 class="game-title">经典贪吃蛇</h3>
                    <p class="game-desc">控制你的小蛇吃掉所有的食物，注意不要撞到墙壁或者自己的身体哦！</p>
                    <a href="snake.html" class="play-btn">即将推出</a>
                </div>
            </div>

            <!-- 游戏卡片 2 -->
            <div class="game-card">
                <div class="game-cover">🧩</div>
                <div class="game-info">
                    <h3 class="game-title">俄罗斯方块</h3>
                    <p class="game-desc">经典下落消除游戏，考验你的反应速度与空间规划能力。</p>
                    <a href="tetris.html" class="play-btn">即将推出</a>
                </div>
            </div>

            <!-- 游戏卡片 3 -->
            <div class="game-card">
                <div class="game-cover">🔢</div>
                <div class="game-info">
                    <h3 class="game-title">2048</h3>
                    <p class="game-desc">滑动数字方块，相同的数字会合并，挑战合成最终的 2048！</p>
                    <a href="2048.html" class="play-btn">即将推出</a>
                </div>
            </div>

            <!-- 游戏卡片 4 -->
            <div class="game-card">
                <div class="game-cover">💣</div>
                <div class="game-info">
                    <h3 class="game-title">扫雷</h3>
                    <p class="game-desc">利用逻辑推理找出所有没有地雷的格子，小心不要踩到地雷。</p>
                    <a href="minesweeper.html" class="play-btn">即将推出</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MySite. 保留所有权利。</p>
    </footer>

</body>
</html>
